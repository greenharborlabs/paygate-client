[package]
name = "platform-utils"
version = "0.1.0+spark.f660f5a3"
edition = "2024"
rust-version = "1.88"

[dependencies]
async-trait = "=0.1.88"
base64 = "=0.22.1"
macros = { git = "https://github.com/breez/spark-sdk.git", rev = "f660f5a3bf24323e5c14235efcd28e5aef06c8aa" }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "http2", "charset", "system-proxy", "rustls-tls"] }
serde = "=1.0.228"
serde_json = "=1.0.150"
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", default-features = false }
tracing = "=0.1.44"

# WASM dependencies
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
web-time = { version = "=1.1.0", features = ["serde"] }
tokio_with_wasm = { version = "=0.8.8", features = [
  "macros",
  "rt",
  "sync",
  "time",
] }
