# Copy to ~/.config/paygate-client/config.yaml for a safe first Rust CLI run.
# test-mode validates configuration and can make ordinary unpaid requests, but
# it is not wired as a live payer in the production Rust CLI.
payer:
  backend: test-mode

policy:
  # Payment is denied unless host, service, amount, fee, and budget policy pass.
  max_request_sats: 50
  max_fee_sats: 10
  daily_budget_sats: 500
  allowed_hosts:
    - localhost:8080
  allowed_services:
    - paygate-reference-service

protocol:
  preferred: L402
  allow_l402: true

# LND REST has a tested Rust adapter contract, but its production HTTP transport
# is not wired in this release. The Rust CLI fails closed for paid LND requests.
#
# These retained compatibility fields document the expected adapter inputs;
# setting them does not enable a production transport:
#   export PAYGATE_CLIENT_LND_REST_URL="https://127.0.0.1:8080"
#   export PAYGATE_CLIENT_LND_MACAROON_HEX="$(xxd -p -c 256 ~/.lnd/data/chain/bitcoin/mainnet/admin.macaroon)"
#   export PAYGATE_CLIENT_LND_TLS_CERT_PATH="$HOME/.lnd/tls.cert"
#
# lnd:
#   rest_url_env: "PAYGATE_CLIENT_LND_REST_URL"
#   macaroon_hex_env: "PAYGATE_CLIENT_LND_MACAROON_HEX"
#   tls_cert_path_env: "PAYGATE_CLIENT_LND_TLS_CERT_PATH"

# Breez SDK Spark is the supported Rust production payer. Paygate forces
# prefer_spark=false and requires a returned Lightning preimage.
#
# To use it, install the Rust CLI from the locked source checkout, change
# payer.backend to breez, and set:
#   export BREEZ_API_KEY="replace-with-breez-api-key"
#   export BREEZ_MNEMONIC="replace-with-wallet-seed-words"
# For restart-persistent local operation, store those exports in the owner-only
# ~/.config/paygate-client/paygate-env.sh companion file with mode 0600.
#
# breez:
#   api_key_env: "BREEZ_API_KEY"
#   mnemonic_env: "BREEZ_MNEMONIC"
#   network: mainnet
#   storage_dir: "~/.local/share/paygate-client/breez"
#   completion_timeout_secs: 10

# Phoenixd is a fail-closed placeholder in the current Rust release. It has no
# endpoint, credential, doctor, or payment transport wired into the CLI.
#
# These retained compatibility fields do not enable Phoenixd payments:
#   export PAYGATE_CLIENT_PHOENIXD_PASSWORD="replace-with-phoenixd-password"
#
# phoenixd:
#   url: "http://127.0.0.1:9740"
#   password_env: "PAYGATE_CLIENT_PHOENIXD_PASSWORD"
#   fee_limit_parameter: "maxFeeSat"
